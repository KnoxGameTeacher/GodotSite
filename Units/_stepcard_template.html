<!-- Step Card Template - Copy this for each step -->
<div class="step-card" data-step="[STEP NUMBER]">
    <div class="step-header">
        <div class="step-number">[STEP NUMBER]</div>
        <div class="step-title">
            <label>
                <input type="checkbox" class="step-check" data-step="[STEP NUMBER]">
                <span>[STEP TITLE]</span>
            </label>
        </div>
    </div>
    <div class="step-content">
        <div class="step-instructions">
            <div class="instruction-section">
                <h4>[SUBHEADING]</h4>
                <p>[Your instructions here...]</p>
                <ul>
                    <li>[Bullet point 1]</li>
                    <li>[Bullet point 2]</li>
                    <li>[Bullet point 3]</li>
                </ul>
                <div class="tip-box">
                    <strong>💡 Tip:</strong> [Helpful tip]
                </div>
            </div>
        </div>
        <div class="step-media">
            <div class="image-container">
                <img src="../../_placeholderimage.png" 
                     alt="[STEP TITLE] example"
                     width="600" 
                     height="400"
                     class="step-image">
                <div class="image-caption">Figure [X].[STEP NUMBER]: [Image description]</div>
            </div>
        </div>
    </div>
</div>
