<!DOCTYPE html>

<head>

<body>
    <div class="main-container">
        <!-- Unit Header - EDIT THESE -->
        <div class="unit-header">
            <h1>Unit X: [REPLACE WITH UNIT NAME]</h1>
            <div class="unit-meta">
                <span class="unit-badge">🎮 [Beginner/Intermediate/Advanced]</span>
                <span class="unit-badge">⏱️ [X] hours</span>

                        <h3>[Section Title]</h3>

            </div>

        <div class="unit-navigation">
            <a href="../../index.html" class="nav-button">← Back to Units</a>
            <div class="unit-completion-status">
                <div class="unit-progress-bar">
                    <div class="unit-progress-fill" id="unit-progress-fill" style="width: 0%"></div>
                </div>
                <span id="completion-status">Unit Progress: 0%</span>
            </div>
